- name: Fetch Netbird secrets from OpenBao
  community.hashi_vault.vault_kv2_get:
    path: "{{ netbird_stack_vault_path }}"
    url: "{{ openbao.addr }}"
    auth_method: token
    token: "{{ lookup('file', openbao.token_path ~ '/' ~ openbao.token_file) }}"
    mount_point: "{{ openbao.kv_mount }}"
  register: _nb_vault
  no_log: true

- name: Set Netbird secret facts
  ansible.builtin.set_fact:
    _nb_auth_secret: "{{ _nb_vault.secret.auth_secret }}"
    _nb_encryption_key: "{{ _nb_vault.secret.encryption_key }}"
    _nb_postgres_password: "{{ _nb_vault.secret.postgres_password }}"
    _nb_bootstrap_admin_email: "{{ _nb_vault.secret.bootstrap_admin_email }}"
    _nb_bootstrap_admin_password: "{{ _nb_vault.secret.bootstrap_admin_password }}"
    _nb_bootstrap_admin_name: "{{ _nb_vault.secret.bootstrap_admin_name }}"
  no_log: true
