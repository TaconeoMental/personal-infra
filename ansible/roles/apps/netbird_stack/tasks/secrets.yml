- name: Assert required netbird_stack secrets are defined
  ansible.builtin.assert:
    that:
      - netbird_stack_secret_auth_secret is defined
      - netbird_stack_secret_encryption_key is defined
      - netbird_stack_secret_postgres_password is defined
      - netbird_stack_secret_bootstrap_admin_email is defined
      - netbird_stack_secret_bootstrap_admin_password is defined
      - netbird_stack_secret_bootstrap_admin_name is defined
    fail_msg: >-
      netbird_stack secrets are mising.
      Define them in host_vars/{{ inventory_hostname }}/secrets.yml
