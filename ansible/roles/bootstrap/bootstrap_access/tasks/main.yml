- name: Assert that 'bootstrap_access_users.*.pubkey_str' variable is defined
  ansible.builtin.assert:
    that:
      - item.pubkey_str is defined
      - item.pubkey_str | length > 0
    fail_msg: "The 'bootstrap_access_users.*.pubkey_str' variable must be set and cannot be empty."
  loop: "{{ bootstrap_access_users }}"
  no_log: true

- name: Create users
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ 'sudo' if item.sudo else '' }}"
    shell: /bin/bash
    password: "{{ item.password | password_hash('sha512') }}"
    append: true
    state: present
  loop: "{{ bootstrap_access_users }}"
  no_log: true

- name: Deploy SSH pubkey for users
  ansible.posix.authorized_key:
    user: "{{ item.user }}"
    key: "{{ item.pubkey_str }}"
    manage_dir: true
    state: present
  loop: "{{ bootstrap_access_users }}"
  no_log: true

- name: Configure custom sshd configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: sshd -t -f %s
  notify: Restart sshd
  changed_when: true

- name: Ensure /etc/sudoers.d/ directory exists
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Configure sudo policy por users
  ansible.builtin.template:
    src: sudoers_config.j2
    dest: /etc/sudoers.d/80-ansible-sudo-users
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
